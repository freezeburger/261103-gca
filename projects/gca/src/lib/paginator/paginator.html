<span class="summary" aria-live="polite">{{ first() }}–{{ last() }} sur {{ total() }}</span>
<div class="pages">
  <button type="button" class="nav" [disabled]="page() <= 1" (click)="goTo(page() - 1)">
    {{ previousLabel() }}
  </button>
  @for (item of pages(); track $index) {
    @if (item === 'gap') {
      <span class="gap" aria-hidden="true">…</span>
    } @else {
      <button
        type="button"
        class="page"
        [class.active]="item === page()"
        [attr.aria-current]="item === page() ? 'page' : null"
        [attr.aria-label]="'Page ' + item"
        (click)="goTo(item)"
      >
        {{ item }}
      </button>
    }
  }
  <button type="button" class="nav" [disabled]="page() >= pageCount()" (click)="goTo(page() + 1)">
    {{ nextLabel() }}
  </button>
</div>
<label class="size">
  {{ pageSizeLabel() }}
  <select [value]="pageSize()" (change)="changeSize($any($event.target).value)">
    @for (option of pageSizeOptions(); track option) {
      <option [value]="option" [selected]="option === pageSize()">{{ option }}</option>
    }
  </select>
</label>
